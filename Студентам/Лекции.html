<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лекции — 1 Медицинский Колледж</title>

    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ===== СБРОС ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Mulish', sans-serif;
            background: #f5f7fa;
            color: #1a1a2e;
            overflow-x: hidden;
        }

        /* ===== ХЕДЕР ===== */
        .hero-half {
            position: relative;
            width: 100vw;
            height: 55vh;
            min-height: 420px;
            background: url('Лекции.jpg') no-repeat center 70% / cover;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .hero-half .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.80);
            z-index: 1;
        }

        .hero-half .logo-top-right {
            position: absolute;
            top: 30px;
            right: 40px;
            z-index: 2;
        }

        .hero-half .logo-top-right img {
            height: 140px;
            width: auto;
            display: block;
            filter: brightness(0) invert(1);
        }

        .hero-half .center-text {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 90%;
            margin-top: -40px;
        }

        .hero-half .center-text h1 {
            font-family: 'Mulish', sans-serif;
            font-weight: 900;
            font-size: 56px;
            color: #ffffff;
            letter-spacing: 4px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
        }

        .hero-half .center-text .white-line {
            width: 240px;
            height: 2.5px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.9) 20%, rgba(255, 255, 255, 0.9) 80%, transparent);
            margin: 12px auto 14px;
            border-radius: 2px;
        }

        .hero-half .center-text .desc-on-photo {
            font-size: 18px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
            max-width: 720px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ===== FIXED КНОПКИ ===== */
        .fixed-buttons {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 999;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .fixed-buttons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: rgba(0, 32, 96, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 50%;
            transition: background 0.25s, transform 0.2s;
            text-decoration: none;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .fixed-buttons a:hover {
            background: #002060;
            transform: scale(1.06);
        }

        .fixed-buttons a svg {
            stroke: white;
            stroke-width: 2.5;
            fill: none;
            width: 22px;
            height: 22px;
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .content {
            padding: 50px 40px 70px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* ===== ГРУППА ===== */
        .group {
            margin-bottom: 50px;
        }

        .group:last-child {
            margin-bottom: 0;
        }

        .group-title {
            font-family: 'Mulish', sans-serif;
            font-weight: 900;
            font-size: 22px;
            color: #002060;
            text-transform: uppercase;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-bottom: 20px;
        }

        .group-title .line {
            height: 2px;
            background: linear-gradient(to right, transparent, #C00000 20%, #C00000 80%, transparent);
            flex: 1;
            min-width: 60px;
            max-width: 300px;
            border-radius: 2px;
        }

        /* ===== СЕТКА (3 КОЛОНКИ) ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 16px;
        }

        /* ===== СЕТКА (1 КОЛОНКА ПО ЦЕНТРУ) ===== */
        .grid-single {
            display: grid;
            grid-template-columns: 1fr;
            justify-items: center;
            margin-top: 16px;
        }

        .grid-single .grid-item {
            max-width: 340px;
            width: 100%;
        }

        .grid-item {
            background: #ffffff;
            border-radius: 14px;
            border: 1.5px solid #002060;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px 18px;
            min-height: 90px;
            font-weight: 700;
            font-size: 18px;
            line-height: 1.3;
            color: #002060;
            transition: transform 0.25s ease, box-shadow 0.3s ease, background 0.25s ease, color 0.25s ease;
            cursor: pointer;
            word-break: break-word;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
            text-decoration: none;
        }

        .grid-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(0, 32, 96, 0.12), 0 4px 12px rgba(0, 0, 0, 0.04);
            background: #002060;
            color: #ffffff;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 1024px) {
            .hero-half .center-text h1 {
                font-size: 44px;
            }
            .hero-half .logo-top-right img {
                height: 100px;
            }
            .group-title {
                font-size: 20px;
                gap: 16px;
            }
            .group-title .line {
                max-width: 250px;
            }
            .grid-item {
                font-size: 16px;
                padding: 20px 16px;
                min-height: 80px;
            }
        }

        @media (max-width: 768px) {
            .hero-half {
                min-height: 340px;
                height: 45vh;
            }
            .hero-half .center-text h1 {
                font-size: 32px;
                letter-spacing: 2px;
            }
            .hero-half .center-text .white-line {
                width: 160px;
            }
            .hero-half .center-text .desc-on-photo {
                font-size: 15px;
                max-width: 90%;
            }
            .hero-half .logo-top-right img {
                height: 70px;
            }
            .hero-half .logo-top-right {
                top: 16px;
                right: 20px;
            }

            .fixed-buttons {
                bottom: 20px;
                left: 20px;
                gap: 10px;
            }
            .fixed-buttons a {
                width: 44px;
                height: 44px;
            }
            .fixed-buttons a svg {
                width: 18px;
                height: 18px;
            }

            .content {
                padding: 30px 16px 50px;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .grid-item {
                font-size: 16px;
                padding: 18px 16px;
                min-height: 70px;
                max-width: 340px;
                width: 100%;
                margin: 0 auto;
            }
            .group-title {
                font-size: 18px;
                gap: 14px;
            }
            .group-title .line {
                max-width: 200px;
            }

            .grid-single .grid-item {
                max-width: 340px;
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .hero-half {
                min-height: 300px;
                height: 40vh;
            }
            .hero-half .center-text {
                margin-top: -20px;
            }
            .hero-half .center-text h1 {
                font-size: 24px;
                letter-spacing: 1.5px;
            }
            .hero-half .center-text .white-line {
                width: 120px;
                height: 2px;
            }
            .hero-half .center-text .desc-on-photo {
                font-size: 13px;
                max-width: 95%;
            }
            .hero-half .logo-top-right img {
                height: 50px;
            }

            .fixed-buttons {
                bottom: 16px;
                left: 16px;
                gap: 8px;
            }
            .fixed-buttons a {
                width: 40px;
                height: 40px;
            }
            .fixed-buttons a svg {
                width: 16px;
                height: 16px;
            }

            .group-title {
                font-size: 15px;
                gap: 10px;
                letter-spacing: 2px;
            }
            .group-title .line {
                max-width: 80px;
            }
            .grid-item {
                font-size: 15px;
                padding: 16px 14px;
                min-height: 60px;
                max-width: 300px;
            }

            .grid-single .grid-item {
                max-width: 300px;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- ========================================= -->
    <!-- ХЕДЕР                                    -->
    <!-- ========================================= -->
    <header class="hero-half">
        <div class="overlay"></div>

        <div class="logo-top-right">
            <img src="Логотип белый.png" alt="Логотип колледжа" />
        </div>

        <div class="center-text">

            <div class="white-line"></div>
            <div class="desc-on-photo">

    <!-- ОСНОВНОЙ КОНТЕНТ                          -->
    <!-- ========================================= -->
    <section class="content">

        <!-- ===== ДНЕВНОЕ ОТДЕЛЕНИЕ ===== -->
        <div class="group">
            <div class="group-title">
                <span class="line"></span>
                ДНЕВНОЕ ОТДЕЛЕНИЕ
                <span class="line"></span>
            </div>
            <div class="grid">
                <a href="Зайцева.html" class="grid-item">Зайцева, 28</a>
                <a href="Крестовский.html" class="grid-item">Крестовский, 18</a>
                <a href="Литейный.html" class="grid-item">Литейный, 56</a>
            </div>
        </div>

        <!-- ===== ВЕЧЕРНЕЕ ОТДЕЛЕНИЕ ===== -->
        <div class="group">
            <div class="group-title">
                <span class="line"></span>
                ВЕЧЕРНЕЕ ОТДЕЛЕНИЕ
                <span class="line"></span>
            </div>
            <div class="grid-single">
                <a href="Вечернее.html" class="grid-item">Вечернее отделение</a>
            </div>
        </div>

    </section>

</body>
