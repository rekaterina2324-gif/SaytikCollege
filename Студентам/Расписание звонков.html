<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Расписание звонков — 1 Медицинский Колледж</title>

    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ===== СБРОС ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Mulish', sans-serif;
            background: #f5f7fa;
            color: #1a1a2e;
            overflow-x: hidden;
        }

        /* ===== ХЕДЕР ===== */
        .hero-half {
            position: relative;
            width: 100vw;
            height: 55vh;
            min-height: 420px;
            background: url('Расписание звонков.jpg') no-repeat center 70% / cover;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .hero-half .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.80);
            z-index: 1;
        }

        .hero-half .logo-top-right {
            position: absolute;
            top: 30px;
            right: 40px;
            z-index: 2;
        }

        .hero-half .logo-top-right img {
            height: 140px;
            width: auto;
            display: block;
            filter: brightness(0) invert(1);
        }

        .hero-half .center-text {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 90%;
            margin-top: -40px;
        }

        .hero-half .center-text h1 {
            font-family: 'Mulish', sans-serif;
            font-weight: 900;
            font-size: 56px;
            color: #ffffff;
            letter-spacing: 4px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
        }

        .hero-half .center-text .white-line {
            width: 240px;
            height: 2.5px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.9) 20%, rgba(255, 255, 255, 0.9) 80%, transparent);
            margin: 12px auto 14px;
            border-radius: 2px;
        }

        .hero-half .center-text .desc-on-photo {
            font-size: 18px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
            max-width: 720px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ===== FIXED КНОПКИ ===== */
        .fixed-buttons {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 999;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .fixed-buttons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: rgba(0, 32, 96, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 50%;
            transition: background 0.25s, transform 0.2s;
            text-decoration: none;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .fixed-buttons a:hover {
            background: #002060;
            transform: scale(1.06);
        }

        .fixed-buttons a svg {
            stroke: white;
            stroke-width: 2.5;
            fill: none;
            width: 22px;
            height: 22px;
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .content {
            padding: 50px 40px 70px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .section-title {
            font-family: 'Mulish', sans-serif;
            font-weight: 900;
            font-size: 22px;
            color: #002060;
            text-transform: uppercase;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-bottom: 30px;
        }

        .section-title .line {
            height: 2px;
            background: linear-gradient(to right, transparent, #C00000 20%, #C00000 80%, transparent);
            flex: 1;
            min-width: 60px;
            max-width: 300px;
            border-radius: 2px;
        }

        /* ===== ДВЕ КАРТИНКИ ===== */
        .images-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: start;
        }

        .image-card {
            background: #ffffff;
            border: 2px solid #002060;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 32, 96, 0.10);
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .image-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(0, 32, 96, 0.18);
        }

        .image-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 1024px) {
            .hero-half .center-text h1 {
                font-size: 44px;
            }
            .hero-half .logo-top-right img {
                height: 100px;
            }
        }

        @media (max-width: 768px) {
            .hero-half {
                min-height: 340px;
                height: 45vh;
            }
            .hero-half .center-text h1 {
                font-size: 32px;
                letter-spacing: 2px;
            }
            .hero-half .center-text .white-line {
                width: 160px;
            }
            .hero-half .center-text .desc-on-photo {
                font-size: 15px;
                max-width: 90%;
            }
            .hero-half .logo-top-right img {
                height: 70px;
            }
            .hero-half .logo-top-right {
                top: 16px;
                right: 20px;
            }

            .fixed-buttons {
                bottom: 20px;
                left: 20px;
                gap: 10px;
            }
            .fixed-buttons a {
                width: 44px;
                height: 44px;
            }
            .fixed-buttons a svg {
                width: 18px;
                height: 18px;
            }

            .content {
                padding: 30px 16px 50px;
            }

            .section-title {
                font-size: 18px;
                gap: 14px;
            }
            .section-title .line {
                max-width: 150px;
            }

            /* Картинки друг под другом */
            .images-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        @media (max-width: 480px) {
            .hero-half {
                min-height: 300px;
                height: 40vh;
            }
            .hero-half .center-text {
                margin-top: -20px;
            }
            .hero-half .center-text h1 {
                font-size: 24px;
                letter-spacing: 1.5px;
            }
            .hero-half .center-text .white-line {
                width: 120px;
                height: 2px;
            }
            .hero-half .center-text .desc-on-photo {
                font-size: 13px;
                max-width: 95%;
            }
            .hero-half .logo-top-right img {
                height: 50px;
            }

            .fixed-buttons {
                bottom: 16px;
                left: 16px;
                gap: 8px;
            }
            .fixed-buttons a {
                width: 40px;
                height: 40px;
            }
            .fixed-buttons a svg {
                width: 16px;
                height: 16px;
            }

            .section-title {
                font-size: 15px;
                gap: 10px;
                letter-spacing: 2px;
            }
            .section-title .line {
                max-width: 60px;
            }

            .image-card {
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ========================================= -->
    <!-- ХЕДЕР                                    -->
    <!-- ========================================= -->
    <header class="hero-half">
        <div class="overlay"></div>

        <div class="logo-top-right">
            <img src="Логотип белый.png" alt="Логотип колледжа" />
        </div>

        <div class="center-text">
            <h1>Расписание звонков</h1>
            <div class="white-line"></div>
            <div class="desc-on-photo">
                Актуальное расписание звонков колледжа.
            </div>
        </div>
    </header>

    <!-- ========================================= -->
    <!-- FIXED КНОПКИ                              -->
    <!-- ========================================= -->
    <div class="fixed-buttons">
        <a href="index.html" aria-label="Назад">
            <svg viewBox="0 0 24 24">
                <path d="M19 12H5M12 19L5 12L12 5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>
        <a href="http://1medcollege.ru/?ref=w3use.com" target="_blank" aria-label="Домой">
            <svg viewBox="0 0 24 24">
                <path d="M3 12L5 10.5M21 12L19 10.5M5 10.5L12 4L19 10.5M5 10.5V19C5 19.5523 5.44772 20 6 20H9M19 10.5V19C19 19.5523 18.5523 20 18 20H15M9 20V16C9 15.4477 9.44772 15 10 15H14C14.5523 15 15 15.4477 15 16V20M9 20H15" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>

            <svg viewBox="0 0 24 24">
                <path d="M22 16.92V19.92C22.0011 20.1985 21.9441 20.4742 21.8325 20.7293C21.7209 20.9845 21.5573 21.2136 21.352 21.4019C21.1467 21.5901 20.9041 21.7335 20.6397 21.8229C20.3754 21.9123 20.0949 21.9459 19.817 21.922C16.7447 21.5859 13.7875 20.5341 11.17 18.85C8.71296 17.2853 6.63837 15.2107 5.073 12.754C3.37743 10.1329 2.32266 7.16377 1.997 4.079C1.97396 3.80247 2.0072 3.52327 2.09524 3.25994C2.18328 2.9966 2.32415 2.75445 2.50933 2.54841C2.6945 2.34237 2.92001 2.17711 3.17184 2.06357C3.42367 1.95003 3.69621 1.89092 3.972 1.89H6.972C7.43363 1.88967 7.87944 2.0498 8.22978 2.3387C8.58012 2.62759 8.80667 3.02375 8.863 3.463C8.96078 4.23782 9.13092 5.00241 9.371 5.747C9.49305 6.13555 9.48801 6.55299 9.35696 6.93831C9.22591 7.32363 8.97539 7.65285 8.646 7.875L7.298 8.813C8.54784 11.1773 10.5353 13.0826 12.965 14.219L13.98 12.823C14.193 12.4894 14.5161 12.2396 14.8954 12.1159C15.2748 11.9922 15.6851 12.0015 16.059 12.142C16.7975 12.3947 17.5576 12.5741 18.329 12.678C18.7707 12.7352 19.169 12.9647 19.4579 13.318C19.7468 13.6714 19.9046 14.1194 19.9 14.581V16.921H19.895L19.9 16.92Z" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>
    </div>

    <!-- ========================================= -->
    <!-- ОСНОВНОЙ КОНТЕНТ                          -->
    <!-- ========================================= -->
    <section class="content">

        <div class="section-title">
            <span class="line"></span>
            РАСПИСАНИЕ ЗВОНКОВ
            <span class="line"></span>
        </div>

        <!-- ===== ДВЕ КАРТИНКИ ===== -->
        <div class="images-grid">
            <div class="image-card">
                <img src="Звонки_1.jpg" alt="Расписание звонков 1" />
            </div>
            <div class="image-card">
                <img src="Звонки_2.jpg" alt="Расписание звонков 2" />
            </div>
        </div>

    </section>

</body>
</html>
